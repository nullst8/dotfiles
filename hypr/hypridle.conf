general {
    lock_cmd = ~/.dotfiles/quickshell-lockscreen/lock.sh & disown    # dbus/sysd lock command (loginctl lock-session)
    unlock_cmd = true                      # no-op (the lockscreen releases the lock on PAM success)
    before_sleep_cmd = ~/.dotfiles/quickshell-lockscreen/lock.sh & disown    # lock before sleeping
    after_sleep_cmd = ~/.dotfiles/quickshell-lockscreen/resume-lock.sh    # reset stale lock state and re-lock on resume
    ignore_dbus_inhibit = false             # whether to ignore dbus-sent idle-inhibit requests (used by e.g. firefox or steam)
    ignore_systemd_inhibit = false          # whether to ignore systemd-inhibit --what=idle inhibitors
}

listener {
    timeout = 600                             # in seconds
    on-timeout = systemctl suspend
    on-resume = true                        # no-op
}
