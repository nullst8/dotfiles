general {
    lock_cmd = ~/.local/share/quickshell-lockscreen/lock.sh & disown    # dbus/sysd lock command (loginctl lock-session)
    unlock_cmd = true                      # no-op (quickshell lockscreen emits two unlock signals)
    before_sleep_cmd = ~/.local/share/quickshell-lockscreen/lock.sh & disown    # command ran before sleep
    after_sleep_cmd = true                 # no-op
    ignore_dbus_inhibit = false             # whether to ignore dbus-sent idle-inhibit requests (used by e.g. firefox or steam)
    ignore_systemd_inhibit = false          # whether to ignore systemd-inhibit --what=idle inhibitors
}

listener {
    timeout = 600                             # in seconds
    on-timeout = systemctl suspend
    on-resume = true                        # no-op
}
