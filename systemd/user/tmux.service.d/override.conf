[Service]
# Reset the continuum-generated ExecStop list and replace it with a guarded
# version: never run resurrect's save.sh unless a tmux server is actually up
# (prevents 0-byte "poison" saves when the server already exited).
ExecStop=
ExecStop=/bin/sh -c 'tmux ls >/dev/null 2>&1 && /home/nullst8/.tmux/plugins/tmux-resurrect/scripts/save.sh || true'
ExecStop=/bin/sh -c 'tmux kill-server 2>/dev/null || true'
Restart=on-failure
RestartSec=2
