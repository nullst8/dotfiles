font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font
italic_font      JetBrainsMono Nerd Font
bold_italic_font JetBrainsMono Nerd Font
font_size 10.8

disable_ligatures always

cursor_shape block
shell_integration no-cursor

window_padding_width 6
confirm_os_window_close 0

# Hyprland deliberately tells every window it is "maximized" (a hack to stop
# clients drawing their own decorations/shadows). With remember_window_size on,
# kitty reads that hint, saves "window-state": "maximized" to
# ~/.cache/kitty/main.json, and then opens every new window maximized on top of
# everything. Disabling it stops kitty persisting/restoring that state so tiling
# behaves normally. See Hyprland #9171 and kitty #10268.
remember_window_size no

map ctrl+shift+alt+super+f12 show_active_gpu_info

# Make Shift+Enter send the extended-key (CSI u) sequence, so tmux can
# forward it to TUI apps like opencode instead of collapsing it to Enter.
map shift+enter send_text all \x1b[13;2u

include colors.conf
include themes/noctalia.conf
