unbind C-b
set-option -g prefix C-a
setw -g mouse on
bind a send-prefix

set -g renumber-windows on
set -s escape-time 0
set -g base-index 1

# Enable extended key sequences (so Shift+Enter reaches TUI apps like opencode)
set -s extended-keys always
set -s extended-keys-format csi-u
set -as terminal-features ',xterm-kitty:extkeys'


bind c new-window -c "#{pane_current_path}"
bind S set status
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

set -g status-left-length 20

set -g default-terminal "tmux-256color"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @continuum-boot 'on'

# Pane switching with prefix + hjkl (Ctrl-chords reserved for nvim)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Alt + hjkl
bind -n M-h resize-pane -L 3
bind -n M-j resize-pane -D 3
bind -n M-k resize-pane -U 3
bind -n M-l resize-pane -R 3

# Copy mode (use Vim keys inside tmux scrollback)
setw -g mode-keys vi

# Quickly reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Status bar style (clean, Vim-like)
set -g status-left "[#S]"
set -g status-right "%Y-%m-%d %H:%M"

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
